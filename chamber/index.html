<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamber of Commerce - Home</title>
    <meta name="description" content="Official home page of the Chamber of Commerce connecting local entrepreneurs, business leaders, and community resources.">
    <meta name="author" content="Senga Sanky">
    <link rel="icon" href="images/favicon.ico">
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Chamber of Commerce - Home">
    <meta property="og:description" content="Official home page of the Chamber of Commerce connecting local entrepreneurs and business leaders.">
    <meta property="og:image" content="https://sankysacre.github.io/wdd231/chamber/images/safaris.jpg">
    <meta property="og:url" content="https://sankysacre.github.io/wdd231/chamber/index.html">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">
</head>
<body>

    <header>
        <span class="logo-title">Chamber of Commerce</span>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="directory.html">Directory</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Chamber of Commerce - Home</h1>

        <section class="card meeting-card">
            <h2>Monthly Breakfast Meeting</h2>
            <p>Connecting entrepreneurs and community leaders over coffee and keynotes.</p>
        </section>

        <!-- Weather Card Component -->
        <section class="card weather-card">
            <h2>Weather</h2>
            
            <div class="weather-current">
                <img id="weather-icon" src="images/crafts.jpg" alt="Weather icon">
                <div class="current-details">
                    <p class="current-temp"><span id="current-temp">28</span>°C</p>
                    <p id="weather-desc" class="capitalize">Broken Clouds</p>
                </div>
            </div>

            <hr class="divider">

            <h3>3-Day Forecast</h3>
            <div id="forecast-container" class="forecast-grid">
                <div class="forecast-day">
                    <span class="day-name">Tue</span>
                    <span class="day-temp">21°C</span>
                </div>
                <div class="forecast-day">
                    <span class="day-name">Wed</span>
                    <span class="day-temp">27°C</span>
                </div>
                <div class="forecast-day">
                    <span class="day-name">Thu</span>
                    <span class="day-temp">24°C</span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Chamber of Commerce</p>
    </footer>

    <script src="scripts/home.mjs" type="module"></script>
</body>
</html>
